  <div class="treeCount" id="treeCount"></div>
  <div class="treeLgd"><span><i class="dot g"></i>improved</span><span><i class="dot r"></i>not</span><span><i class="dot o"></i>pending</span><span><i class="dot a"></i>harness run</span></div>
  <div class="tree" id="tree"><div class="empty">loading…</div></div>
 </div>
 <div class="wrap">
  <div id="detailWrap"></div>
  <div class="stats" id="stats"></div>
  <div id="restabWrap"></div>
  <div class="ctl">
   <input id="q" placeholder="search pr / title…">
   <select id="field"><option value="">all fields</option></select>
   <select id="status"><option value="">all</option><option value="improved">improved</option><option value="not">not improved</option><option value="pending">pending</option></select>
  </div>
  <div class="grid" id="grid"></div>
  <footer>live: reads <code>index.json</code> + <code>results/&lt;pr&gt;.json</code> per PR (manifest) · auto-refresh every 60 s</footer>
 </div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':(''+s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let IDX=[], RES={}, AREA={};   // AREA: pr -> {field, area}
let SEL=null;    // PR selected in the tree: its results go to the top of the list
let TFILT='all';   // tree scope: all | run (has a measured result) | solved (has a harness arm)
// run  = we executed the workload (result exists in RES)
// solved = a solver harness arm (not baseline / PR solution) landed in that result
function isRun(pr){return !!RES[pr];}
function isSolved(pr){const r=RES[pr];return !!(r&&r.arms&&Object.keys(r.arms).some(k=>k!=='base'&&k!=='gold'));}
function passTFilt(pr){return TFILT==='all'?true:TFILT==='run'?isRun(pr):isSolved(pr);}
// light inline folder icon (mimics data/viewer.html)
const FOLDER=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`;

async function boot(){
 const no={cache:'no-store'};
 const setHH=()=>document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px');
 setHH(); window.addEventListener('resize',setHH); document.querySelector('header img').addEventListener('load',setHH);
 IDX=await fetch('../index.json',no).then(r=>r.json()).catch(()=>[]);
 RES=await loadResults();
 // pr -> {field, area} map (needed to construct md paths). data/area.json is the
 // compact 202-PR subset (~20 KB, built by gen_area.py); the full crawl jsonl
 // (~10 MB) is only a fallback and is fetched AFTER first render so a slow link
 // (Tailscale Funnel) never blocks the dashboard.
 const want=new Set(IDX.map(r=>r.pr));
 const area=await fetch('../data/area.json',no).then(r=>r.ok?r.json():null).catch(()=>null);
 if(area){Object.keys(area).forEach(k=>{AREA[+k]=area[k];});}
 else{
  fetch('../data/index.jsonl',no).then(r=>r.text()).catch(()=>'').then(jl=>{
   jl.split('\n').forEach(line=>{
    if(!line) return;
    try{const r=JSON.parse(line); if(want.has(r.pr)) AREA[r.pr]={field:r.field,area:r.area};}catch(e){}
   });
  });
 }
 const fields=[...new Set(IDX.map(r=>r.field).filter(Boolean))].sort();
 fields.forEach(f=>$('#field').add(new Option(f,f)));
 ['q','field','status'].forEach(id=>$('#'+id).addEventListener('input',render));
 $('#tq').addEventListener('input',buildTree);
 $('#tfilt').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  TFILT=b.dataset.f;
  $('#tfilt').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  buildTree();}));
 $('#cAll').textContent=IDX.length;
 $('#cRun').textContent=IDX.filter(r=>isRun(r.pr)).length;
 $('#cSolved').textContent=IDX.filter(r=>isSolved(r.pr)).length;
 buildTree();
 render();
 setInterval(refreshResults,60000);   // live: pick up new results/all.json without a reload
}
// Results are read PER PR: results/manifest.json lists the PR ids that have a
// results/<pr>.json (written by aggregate.py); each file is fetched directly, in
// parallel. results/all.json is only the fallback when the manifest is missing.
async function loadResults(){
 const no={cache:'no-store'};
 const man=await fetch('../results/manifest.json',no).then(r=>r.ok?r.json():null).catch(()=>null);
 const out={};
 if(man&&Array.isArray(man.prs)){
  const rows=await Promise.all(man.prs.map(pr=>fetch(`../results/${pr}.json`,no).then(r=>r.ok?r.json():null).catch(()=>null)));
  rows.forEach(r=>{if(r&&r.pr!=null) out[r.pr]=r;});
  return out;
 }
 const all=await fetch('../results/all.json',no).then(r=>r.ok?r.json():[]).catch(()=>[]);
 all.forEach(r=>out[r.pr]=r); return out;
}
async function loadOne(pr){   // fresh read of one PR's own results file
 try{const r=await fetch(`../results/${pr}.json`,{cache:'no-store'}); if(r.ok){const j=await r.json(); if(j&&j.pr!=null) RES[j.pr]=j; return j;}}catch(e){}
 return RES[pr];
}
let LAST_SIG='';
async function refreshResults(){
 try{
  const fresh=await loadResults();
  const sig=JSON.stringify(Object.keys(fresh).sort().map(k=>[k,fresh[k].ts||'',Object.keys(fresh[k].arms||{}).length]));
  if(sig===LAST_SIG) return;
  LAST_SIG=sig; RES=fresh;
  $('#cRun').textContent=IDX.filter(r=>isRun(r.pr)).length;
  $('#cSolved').textContent=IDX.filter(r=>isSolved(r.pr)).length;
  buildTree(); render();
  if(SEL!=null&&$('#detailWrap').innerHTML) showPR(SEL);
 }catch(e){}
}
function fmt(x,d=3){return (x==null||isNaN(x))?'—':(+x).toFixed(d)}
function statusOf(pr){const r=RES[pr]; if(!r)return 'pending'; return r.improved?'improved':'not'}

// ---------- LEFT TREE ----------
function mdPath(pr){const a=AREA[pr]; if(!a||!a.field||!a.area)return null;
 return `../data/prs/${a.field}/${a.area.replace(/\//g,'_')}/${pr}.md`;}
function shortTitle(t){return (t||'').replace(/\s*\(#\d+\)\s*$/,'');}

function buildTree(){
 const q=$('#tq').value.trim().toLowerCase();
 const rows=IDX.filter(r=>{
  if(!passTFilt(r.pr)) return false;
  if(!q) return true;
  return (''+r.pr).includes(q) || (r.title||'').toLowerCase().includes(q);
 });
 $('#treeCount').textContent=`${rows.length} PR${rows.length===1?'':'s'}${TFILT==='all'?'':' · '+TFILT}`;
 const el=$('#tree'); el.innerHTML='';
 if(!rows.length){el.innerHTML='<div class="empty">no '+(TFILT==='all'?'':TFILT+' ')+'PRs match</div>';return;}
 // group by field
 const t={};
 rows.forEach(r=>{const f=r.field||'∅ no field';(t[f]=t[f]||[]).push(r);});
 const keys=Object.keys(t).sort((a,b)=>t[b].length-t[a].length);  // field count desc
 keys.forEach(k=>{
  const list=t[k].sort((x,y)=>x.pr-y.pr);                          // PRs by number
  const openAll=!!q||TFILT!=='all';                                // auto-expand when searching or scoped
  const gd=mk('div','tnode tfield',`<span class="caret${openAll?' open':''}">▶</span><span class="fico">${FOLDER}</span><span class="gname">${esc(k)}</span><span class="cnt">${list.length}</span>`);
  const gc=mk('div','children'+(openAll?'':' closed'));
  if(!openAll) gc.style.maxHeight='0px';
  list.forEach(r=>gc.appendChild(prRow(r)));
  gd.addEventListener('click',()=>toggle(gd,gc));
  el.appendChild(gd); el.appendChild(gc);
 });
}
function prRow(r){
 const res=RES[r.pr], st=statusOf(r.pr);
 const stDot=st==='improved'?'<span class="dot g" title="improved"></span>':
   st==='not'?'<span class="dot r" title="not improved"></span>':'<span class="dot o" title="pending"></span>';
 // harness-run dot: any solver arm (not baseline / PR solution) present in results
 const hasH=res&&res.arms&&Object.keys(res.arms).some(k=>k!=='base'&&k!=='gold');
 const hDot=hasH?'<span class="dot a" title="harness run"></span>':'';
 const chips=`<span class="chips-mini">${stDot}${hDot}</span>`;
 const pd=mk('div','tnode tpr',`<span class="n">#${r.pr}</span> <span class="tt">${esc(shortTitle(r.title))}</span>${chips}`);
 pd.dataset.pr=r.pr;
 pd.title='#'+r.pr+' · '+(r.title||'');
 pd.addEventListener('click',ev=>{ev.stopPropagation();
  document.querySelectorAll('.tpr.sel').forEach(n=>n.classList.remove('sel'));
  pd.classList.add('sel'); showPR(r.pr);});
 return pd;
}
function toggle(headEl,childEl){
 const open=!childEl.classList.contains('closed');
 const c=headEl.querySelector('.caret');
 if(open){
  childEl.style.maxHeight=childEl.scrollHeight+'px';requestAnimationFrame(()=>childEl.style.maxHeight='0px');
  childEl.classList.add('closed');c&&c.classList.remove('open');
 }else{
  childEl.classList.remove('closed');childEl.style.maxHeight=childEl.scrollHeight+'px';
  c&&c.classList.add('open');
  setTimeout(()=>{if(!childEl.classList.contains('closed'))childEl.style.maxHeight='none';},240);
 }
}
function mk(tag,cls,html){const d=document.createElement(tag);d.className=cls;if(html!=null)d.innerHTML=html;return d;}

// ---------- tiny markdown -> html ----------
function mdToHtml(src){
 const lines=(src||'').replace(/\r/g,'').split('\n');
 let out='',inCode=false,inList=false;
 const inline=s=>esc(s)
   .replace(/`([^`]+)`/g,'<code>$1</code>')
   .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
   .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
 const closeList=()=>{if(inList){out+='</ul>';inList=false;}};
 for(let raw of lines){
  if(raw.trim().startsWith('```')){
   if(inCode){out+='</code></pre>';inCode=false;}
   else{closeList();out+='<pre><code>';inCode=true;}
   continue;
  }
  if(inCode){out+=esc(raw)+'\n';continue;}
  const h=raw.match(/^(#{1,6})\s+(.*)$/);
  if(h){closeList();const n=Math.min(3,h[1].length);out+=`<h${n}>${inline(h[2])}</h${n}>`;continue;}
  const li=raw.match(/^\s*[-*]\s+(.*)$/);
  if(li){if(!inList){out+='<ul>';inList=true;}out+=`<li>${inline(li[1])}</li>`;continue;}
  if(!raw.trim()){closeList();continue;}
  out+=`<p style="margin:5px 0">${inline(raw)}</p>`;
 }
 if(inCode)out+='</code></pre>'; closeList();
 return out;
}

// ---------- per-experiment results table (reported / measured / <harness_i>) ----------
// One table PER experiment. measured = our run of the PR's solution = 1.00x ref; variance in (±).
// A PR carries res.experiments[] (schema experiments_v2). Legacy res.latency -> single synthetic exp.
function experimentsOf(res){
 if(!res) return [];
 if(res.experiments) return res.experiments;
 if(res.latency){const L=res.latency;
  const rep=L.reported&&(L.reported.get_new_blocks||Object.values(L.reported)[0]);
  return [{name:L.workload||'latency',unit:L.unit||'',
    reported:rep?{base:rep.base_us,patch:rep.patch_us}:null,
    arms:Object.assign({base:L.base},L.arms||{})}];}
 return [];
}
// harnesses that ALWAYS get a row (even when pending). plus any extra arm keys seen.
const HARNESSES=['claude',"claude + PR's solution",'codex',"codex + PR's solution"];
// higher-is-better units (throughput). everything else = time, lower-is-better.
function higherBetter(unit){return /\/s$|\bit\/s\b|tok\/s|req\/s/.test(unit||'');}
// speedup of `val` relative to `baseVal`, direction-aware for the unit. >1 = faster.
function gainVs(val,baseVal,unit){
 if(val==null||baseVal==null||!val||!baseVal) return null;
 return higherBetter(unit)? val/baseVal : baseVal/val;
}
// resolve the PR author's REPORTED absolute value in the task unit.
// reported may carry:
//   {base, patch}  -> both absolute; value=patch, authorBase=base
//   {delta, base?} -> an improvement magnitude in units; value = baseline±delta
//   {pct,   base?} -> a fractional improvement;         value = baseline*(1±pct)
// baseline defaults to OUR measured baseline when the author gave none.
// sign direction-aware: throughput improves UP, time improves DOWN.
function resolveReported(rep,baseV,unit,derived){
 // preferred: numbers pre-computed by derive.py (results/<pr>.json experiments[i].derived); the browser does no math then
 if(derived&&derived.reported&&derived.reported.pr_solution!=null)
  return {value:+derived.reported.pr_solution, authorBase:derived.reported.baseline!=null?+derived.reported.baseline:null, how:derived.reported.how||'derived',
          marker:derived.reported.marker||'', raw:derived.reported.raw||'', note:derived.reported.note||''};
 if(!rep) return null;
 const up=higherBetter(unit);
 if(rep.patch!=null) return {value:+rep.patch, authorBase:rep.base!=null?+rep.base:null, how:'absolute'};
 if(rep.delta!=null){const ab=rep.base!=null?+rep.base:baseV; if(ab==null) return null;
  return {value: up? ab+Math.abs(rep.delta): ab-Math.abs(rep.delta), authorBase:ab, how:rep.base!=null?'author baseline ± diff':'our baseline ± diff'};}
 if(rep.pct!=null){const ab=rep.base!=null?+rep.base:baseV; if(ab==null) return null;
  const f=Math.abs(rep.pct)>1?rep.pct/100:rep.pct;
  return {value: up? ab*(1+f): ab*(1-f), authorBase:ab, how:rep.base!=null?'author baseline ± %':'our baseline ± %'};}
 return null;
}
// Δ vs baseline in task units. positive = improvement (direction-aware).
function deltaVs(val,baseV,unit){if(val==null||baseV==null)return null;
 return higherBetter(unit)? val-baseV : baseV-val;}
function dcell(d,unit){if(d==null)return '<td class="num muted">—</td>';
 const s=d>=0?'+':'−'; return `<td class="num">${s}${Math.abs(d).toFixed(3)} <span class="muted">${esc(unit)}</span></td>`;}
function rcell(r){return r==null?'<td class="num muted">—</td>':`<td class="num">${r.toFixed(2)}×</td>`;}
function gcells(val,baseV,unit){return dcell(deltaVs(val,baseV,unit),unit)+rcell(gainVs(val,baseV,unit));}
const dblank='<td class="num muted">—</td>', rblank='<td class="num muted">—</td>';
// REPORTED (orange) rows: fill Δ/× vs the author's REPORTED baseline; measured pair blank.
function gcellsRep(val,repB,unit){
 return dcell(deltaVs(val,repB,unit),unit)+rcell(gainVs(val,repB,unit))+dblank+rblank;}
// MEASURED (blue) rows: reported pair blank; fill Δ/× vs OUR MEASURED baseline.
function gcellsMeas(val,measB,unit){
 return dblank+rblank+dcell(deltaVs(val,measB,unit),unit)+rcell(gainVs(val,measB,unit));}
function expTable(exp){
 const a=exp.arms||{}, unit=exp.unit||'value';
 const baseV=(a.base||{}).mean;                     // before-merge baseline value, in unit
 const num=(m,sd)=> m==null?'—':`<span class="mv">${(+m).toFixed(3)}</span>${sd==null?'':`<span class="var">(±${(+sd).toFixed(3)})</span>`}`;
 const bh=baseV!=null?`<span class="eb">baseline (measured) ${(+baseV).toFixed(3)} ${esc(unit)}</span>`:'';
 let h=`<div class="expH">${esc(exp.name)} <span class="eu">${esc(unit)}</span>${bh}`+
   (exp.workload?`<span class="ew" title="${esc(exp.workload)}">${esc(exp.workload)}</span>`:'')+`</div>`;
 h+=`<table class="restab exp"><colgroup><col class="c-row"><col class="c-val"><col class="c-d"><col class="c-r"><col class="c-d"><col class="c-r"><col class="c-src"></colgroup>`+
   `<thead><tr><th>row</th><th class="num">value · ${esc(unit)}</th>`+
   `<th class="num r-rep">Δ vs reported</th><th class="num r-rep">× vs reported</th>`+
   `<th class="num r-meas">Δ vs measured</th><th class="num r-meas">× vs measured</th><th>source <span class="muted" title="* = author gave only a ratio/% — applied to our reproduced baseline&#10;+ = author gave only a difference — applied to our reproduced baseline">(<sup class="mark">*</sup> ratio applied, <sup class="mark">+</sup> diff applied to our baseline)</span></th></tr></thead><tbody>`;
 // FOUR rows, two colors, grouped by WHICH-CODE (baselines together, solutions together):
 //   within each pair, reported (orange) comes FIRST, measured (blue) AFTER.
 // row order: baseline(reported) -> baseline(measured) -> solution(reported) -> solution(measured)
 // bracket suffix is consistent per color: "(reported by PR's author)" / "(measured by us)"
 // metric cols: Δ/× vs author's REPORTED baseline (repB), then Δ/× vs OUR MEASURED baseline (baseV)
 const rep=exp.reported||null;
 const authorHasBase = !!(rep && rep.base!=null);
 const repB = authorHasBase ? +rep.base : null;   // author's OWN reported baseline (null if none)
 const Rr=resolveReported(rep,baseV,unit,exp.derived);
 const goldV=(a.gold||{}).mean;
 const SM='<span class="tag-m">(measured by us)</span>', SR='<span class="tag-r">(reported by author)</span>';
 // 1. baseline (reported by PR's author) — author's OLD-code number, or — if absent.
 if(authorHasBase){
  h+=`<tr class="r-reported"><td>baseline ${SR}</td><td class="num">${num(+rep.base,0)}</td>`+
     gcellsRep(+rep.base,repB,unit)+`<td class="src">PR author, old code</td></tr>`;
 }else{
  const miss = rep&&rep.pct!=null?'a ratio/%':(rep&&rep.delta!=null?'a delta':'no number');
  h+=`<tr class="r-reported"><td>baseline ${SR}</td><td class="num muted">—</td>`+
     `<td class="num muted">—</td><td class="num muted">—</td><td class="num muted">—</td><td class="num muted">—</td><td class="src">author gave ${esc(miss)} — using our baseline as reference</td></tr>`;
 }
 // 2. baseline (measured by us) — our run of before-merge tree. 1.00x reference.
 h+=`<tr class="baserow r-measured"><td>baseline ${SM}</td><td class="num">${num(baseV,(a.base||{}).sd)}</td>`+
    gcellsMeas(baseV,baseV,unit)+`<td class="src" title="our run of before-merge tree (base_sha) — 1.00× reference">our run of before-merge tree (base_sha) — 1.00× reference</td></tr>`;
 // 3. PR's author solution (reported by PR's author) — author's NEW-code number, or — if absent.
 if(Rr){
  // marker: * = ratio/% applied to our baseline, + = delta applied to our baseline (author gave no baseline number)
  const mk=Rr.marker?`<sup class="mark" title="${esc(Rr.note)}">${Rr.marker}</sup>`:'';
  h+=`<tr class="r-reported"><td>PR's author solution ${SR}</td><td class="num">${num(Rr.value,0)}${mk}</td>`+
     gcellsRep(Rr.value,Rr.authorBase,unit)+`<td class="src" title="${esc(Rr.note)}">PR author <span class="muted">(${esc(Rr.how)})${Rr.raw?' — reported: '+esc(Rr.raw):''}</span></td></tr>`;
 }else{
  h+=`<tr class="r-reported"><td>PR's author solution ${SR}</td><td class="num muted">—</td><td class="num muted">—</td><td class="num muted">—</td><td class="num muted">—</td><td class="num muted">—</td><td class="src">no number in PR</td></tr>`;}
 // 4. PR's author solution (measured by us) — our run of after-merge tree.
 h+=`<tr class="r-measured"><td>PR's author solution ${SM}</td><td class="num">${num(goldV,(a.gold||{}).sd)}</td>`+
    gcellsMeas(goldV,baseV,unit)+`<td class="src" title="our run of after-merge tree (merge_sha)">our run of after-merge tree (merge_sha)</td></tr>`;
 // harness arms — ALWAYS show claude + codex (+ any extra arm present), pending if absent
 const keys=HARNESSES.concat(Object.keys(a).filter(k=>!['base','gold'].includes(k)&&!HARNESSES.includes(k)));
 keys.forEach(k=>{const arm=a[k];
  if(arm&&arm.mean!=null){
   h+=`<tr><td>${esc(k)}</td><td class="num">${num(arm.mean,arm.sd)}</td>`+
      gcellsMeas(arm.mean,baseV,unit)+
      `<td class="src">solver arm</td></tr>`;
  }else{
   h+=`<tr><td>${esc(k)}</td><td class="num muted">pending</td><td class="num muted">—</td><td class="num muted">—</td><td class="num muted">—</td><td class="num muted">—</td><td class="src">not run yet</td></tr>`;}
 });
 h+='</tbody></table>';
 // scale / comparability banner — makes the reported-vs-measured divergence fix VISIBLE
 if(rep&&(rep.comparable===false||rep.workload_invalid||rep.scope||rep.scale_note||rep.scale_short)){
  const inv=!!rep.workload_invalid;
  const tag=inv?'WORKLOAD INVALID':(rep.comparable===false?'NOT 1:1':'SCALE NOTE');
  const short=rep.scale_short||rep.scope||'';
  h+=`<div class="scalebox${inv?' inv':''}"><span class="sb-tag">${tag}</span>`+
     (short?` <span class="sb-s">${esc(short)}</span>`:'')+
     (rep.scale_note?`<div class="sb-l" title="${esc(rep.scale_note)}"><b>details ▸</b> <span class="sb-full">${esc(rep.scale_note)}</span></div>`:'')+
     `</div>`;
 }
 return h;
}
function harnessTable(res){
 const exps=experimentsOf(res);
 if(!exps.length){
  if(res&&res.schema==='experiments_v2') // ran, but correctness-only (no timing)
   return '<div class="muted" style="padding:8px 2px">correctness-only — no timing experiment'+(res.note?'. '+esc(res.note):'')+'</div>';
  return '<div class="muted" style="padding:8px 2px">no results yet — run <code>./run.sh '+(res?res.pr:'')+'</code></div>';
 }
 return exps.map(expTable).join('');
}

// ---------- PR DETAIL PANEL (challenge results TOP · PR info BOTTOM) ----------
// fold state of the two detail sections, remembered per browser
let FOLD={results:false,info:false};
try{FOLD=Object.assign(FOLD,JSON.parse(localStorage.getItem('fvllm.fold')||'{}'));}catch(e){}
function toggleSec(h){const sec=h.parentElement; sec.classList.toggle('folded');
 FOLD[sec.dataset.k]=sec.classList.contains('folded'); try{localStorage.setItem('fvllm.fold',JSON.stringify(FOLD));}catch(e){}}
async function showPR(pr){
 SEL=pr; await loadOne(pr); render(); window.scrollTo({top:0,behavior:'smooth'});
 const r=IDX.find(x=>x.pr===pr)||{pr}, res=RES[pr];
 const D=$('#detailWrap');
 const url='https://github.com/vllm-project/vllm/pull/'+pr;
 const st=statusOf(pr);
 const stChip=st==='improved'?'<span class="chip imp">improved</span>':
   st==='not'?'<span class="chip no">not improved</span>':'<span class="chip pend">pending</span>';
 const arms=res?Object.entries(res.arms||{}).map(([k,v])=>`${esc(k)}:${esc(v.tests)}`).join(' · '):'';
 D.innerHTML=`<div class="detail">
  <span class="close" title="close" onclick="document.getElementById('detailWrap').innerHTML='';document.querySelectorAll('.tpr.sel').forEach(n=>n.classList.remove('sel'))">×</span>
  <h2>#${pr} ${esc(shortTitle(r.title))}</h2>
  <div class="dmeta"><span class="chip field">${esc(r.field||'—')}</span> ${stChip}
   · <a href="${url}" target="_blank">GitHub PR #${pr}</a>
   · reported: ${esc(r.reported_gain||'—')}</div>
  <!-- TOP: challenge results with harnesses -->
  <div class="dsec${FOLD.results?' folded':''}" data-k="results">
   <div class="dsecH" onclick="toggleSec(this)"><span class="fcaret">▾</span>challenge results · baseline (measured) = 1.00× reference · <span style="color:#0b8ce8">measured=our run</span> · <span style="color:#b97a00">reported=PR author</span></div>
   <div class="dbody">${harnessTable(res)}
   ${arms?`<div class="meta" style="margin-top:4px">tests: ${arms}</div>`:''}</div>
  </div>
  <!-- BOTTOM: PR info -->
  <div class="dsec${FOLD.info?' folded':''}" data-k="info">
   <div class="dsecH" onclick="toggleSec(this)"><span class="fcaret">▾</span>PR info · baseline ${esc((r.base_sha||'').slice(0,10))} → merge ${esc((r.merge_sha||'').slice(0,10))} <span class="fhint">click to fold / unfold</span></div>
   <div class="dbody"><div class="md" id="mdbody"><span class="muted">loading detail…</span></div></div>
  </div>
 </div>`;
 const p=mdPath(pr);
 if(!p){$('#mdbody').innerHTML='<span class="muted">no detail file (missing area mapping)</span>';return;}
 try{
  const t=await fetch(p,{cache:'no-store'}).then(x=>{if(!x.ok)throw 0;return x.text();});
  $('#mdbody').innerHTML=mdToHtml(t);
 }catch(e){$('#mdbody').innerHTML='<span class="muted">could not load '+esc(p)+'</span>';}
}

// ---------- MAIN CONTENT (stats + results table + cards) ----------
function render(){
 const q=$('#q').value.trim().toLowerCase(), ff=$('#field').value, sf=$('#status').value;
 // stats over ALL measured
 // processed = we ran the PR (result exists); measured = our own numbers exist for
 // baseline AND PR solution on >=1 experiment; improved = correctness gate (after-merge reproduces)
 const processed=IDX.filter(r=>RES[r.pr]);
 const hasMeas=res=>experimentsOf(res).some(e=>e.arms&&e.arms.base&&e.arms.base.mean!=null&&e.arms.gold&&e.arms.gold.mean!=null);
 const measured=processed.filter(r=>hasMeas(RES[r.pr]));
 const imp=processed.filter(r=>RES[r.pr].improved).length;
 const N=IDX.length, nP=processed.length, nM=measured.length;
 const solvedN=IDX.filter(r=>isSolved(r.pr)).length;
 $('#ts').textContent = nP? ('updated '+ (RES[processed[0].pr]||{}).ts||'') : '';
 const pct=x=>N?(x/N*100):0;
 $('#stats').innerHTML=[
  ['total PRs',N,'a'],
  ['processed',nP,'a'],
  ['measured',nM,'c'],
  ['improved',imp,'g'],
 ].map(([k,v,c])=>`<div class="stat"><div class="k">${k}</div><div class="v ${c}">${v}</div><div class="pc">${k==='total PRs'?'202 real vLLM perf PRs':(pct(v).toFixed(0)+'% of '+N)}</div></div>`).join('')
 + `<div class="stat prog" style="grid-column:1/-1"><div class="k">progress <span class="kk">processed → measured → improved · of ${N} PRs</span></div>
    <div class="bar">
     <i class="seg s-meas" style="width:${pct(nM)}%" title="measured: ${nM}"></i>
     <i class="seg s-proc" style="width:${pct(nP-nM)}%" title="processed, not yet measured: ${nP-nM}"></i>
     <i class="seg s-pend" style="flex:1" title="pending: ${N-nP}"></i></div>
    <div class="legend">
     <span><i class="sw s-meas"></i>measured <b>${nM}</b></span>
     <span><i class="sw s-proc"></i>processed, not measured <b>${nP-nM}</b></span>
     <span><i class="sw s-pend"></i>pending <b>${N-nP}</b></span>
     <span class="sep"></span>
     <span><i class="sw s-imp"></i>improved (gate) <b>${imp}</b></span>
     <span><i class="sw s-solv"></i>solver arms <b>${solvedN}</b></span>
    </div></div>`;

 // top results · one table per (PR, experiment). baseline (measured) = 1.00× ref.
 let latRows=measured.map(r=>RES[r.pr]).filter(r=>experimentsOf(r).length);
 if(SEL!=null){const i=latRows.findIndex(r=>r.pr===SEL); if(i>0){const [x]=latRows.splice(i,1); latRows.unshift(x);}}
 if(latRows.length||SEL!=null){
  let h='';
  if(SEL!=null&&!latRows.some(r=>r.pr===SEL)){const ix=IDX.find(r=>r.pr===SEL)||{};
   h+=`<div class="prHead sel"><a href="https://github.com/vllm-project/vllm/pull/${SEL}" target="_blank">#${SEL}</a> <span class="muted">${esc(shortTitle(ix.title))}</span> <span class="chip pend">no measured results yet</span></div>`;}
  latRows.forEach(r=>{
   const prCell=`<a href="${r.pr_url}" target="_blank">#${r.pr}</a> <span class="muted">${esc(shortTitle(r.title))}</span>`;
   h+=`<div class="prHead${r.pr===SEL?' sel':''}">${prCell}${r.pr===SEL?' <span class="chip field">selected</span>':''}</div>`;
   h+=experimentsOf(r).map(expTable).join('');
  });
  $('#restabWrap').innerHTML='<h2 class="secH">experiment results <span>one table per experiment · baseline (measured) = 1.00× reference · variance in (±)</span></h2>'+h;
 } else $('#restabWrap').innerHTML='<table class="restab"><tbody><tr><td class="muted">no results yet — run <code>./run.sh</code></td></tr></tbody></table>';

 // per-PR cards
 const rows=IDX.filter(r=>{
  if(ff&&r.field!==ff)return false;
  const st=statusOf(r.pr); if(sf&&st!==sf)return false;
  if(q&&!((''+r.pr).includes(q)||(r.title||'').toLowerCase().includes(q)))return false;
  return true;});
 $('#grid').innerHTML=rows.map(r=>{
  const res=RES[r.pr], st=statusOf(r.pr);
  const stChip=st==='improved'?'<span class="chip imp">improved</span>':
    st==='not'?'<span class="chip no">not improved</span>':'<span class="chip pend">pending</span>';
  let lat='';
  const exps=experimentsOf(res);
  if(exps.length){
   lat='<div class="lat"><table>'+exps.map(e=>{const a=e.arms||{},g=a.gold||{};
     return `<tr><td>${esc(e.name)}</td><td class="n">${fmt(g.mean)} ${esc(e.unit||'')}${g.speedup_x!=null?' · '+fmt(g.speedup_x,1)+'×':''}</td></tr>`;}).join('')+
    '</table></div>';}
  const arms=res?Object.entries(res.arms||{}).map(([k,v])=>`${k}:${v.tests}`).join(' · '):'';
  return `<div class="card">
   <h3><a href="${r.pr?('https://github.com/vllm-project/vllm/pull/'+r.pr):'#'}" target="_blank">#${r.pr}</a>
     <span class="chip field">${r.field||'—'}</span> ${stChip}</h3>
   <div class="t">${(r.title||'').replace(/</g,'&lt;')}</div>
   <div class="meta">reported: ${r.reported_gain||'—'} · baseline ${(r.base_sha||'').slice(0,10)} → merge ${(r.merge_sha||'').slice(0,10)}</div>
   ${arms?`<div class="meta">tests: ${arms}</div>`:''}
   ${lat}
  </div>`;}).join('')||'<div class="muted">no match</div>';
}
boot();
</script>
</body></html>
